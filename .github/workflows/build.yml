on:
  push:
    branches:
      - main

jobs:
    quality-check:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1

        - name: Install python
          uses: actions/setup-python@v7
          with:
            python-version: '3.11.x'

        - name: Install Ruff
          run: |
            python -m pip install --upgrade pip
            pip install ruff

        - name: Ruff quality check
          continue-on-error: true
          run: |
            ruff check . --select ANN,D,E,W,I,COM,Q,PTH,UP,C901,PLR,PERF

    code-validate:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1

        - name: Install python
          uses: actions/setup-python@v7
          with:
            python-version: '3.11.x'

        - name: Install Ruff
          run: |
            python -m pip install --upgrade pip
            pip install ruff

        - name: Ruff Validation
          run: |
            ruff check . --select F, B, S, BLE, RET

        - name: Docker Validation
          uses: hadolint/hadolint-action@v3.5.0
          with:
            dockerfile: Dockerfile

    pytest-validate:
      runs-on: windows-2022
      steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1

        - name: Install python
          uses: actions/setup-python@v7
          with:
            python-version: '3.11.x'

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
            pip install -r requirements.txt

        - name: Pytest Validation
          run: |
            pytest tests/application

    build:
      needs: 
        - code-validate
        - pytest-validate
      runs-on: windows-2022
      steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1

        - name: Check Docker
          run: |
            docker --version

        - name: Build Docker
          run: |
            docker build -t stiukov-tests .

        - name: Run Docker
          run: |
            docker run --rm stiukov-tests
    #deploy
